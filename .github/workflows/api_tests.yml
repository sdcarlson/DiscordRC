name: API Tests

on:
  pull_request:
    branches:
    - main
jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    # Throwaway credentials for the ephemeral CI database only.
    # (The `env` context is not available in `services`, so they are repeated there.)
    env:
      MONGO_USERNAME: ci-user
      MONGO_PASSWORD: ci-password
      JWT_SECRET_KEY: ci-only-jwt-secret
    services:
      mongodb:
        image: mongo
        ports:
        - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ci-user
          MONGO_INITDB_ROOT_PASSWORD: ci-password
          MONGO_INITDB_DATABASE: db-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up venv
      run: |
        python -m venv api/venv
    - name: Install dependencies
      run: |
        source api/venv/bin/activate
        pip install -r api/requirements.txt
    - name: Run tests
      run: |
        bash api/tests/run_tests.sh
